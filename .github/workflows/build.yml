name: Build

on:
  push:
    branches: [master]
    tags: ["v*"]

# 既定は read-only。release への書き込みは release job だけに与える。
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # install script / build / test 中に書き込みトークンを露出させない。
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # asset は src/update/platform.ts の ASSET_* 定数と一致している必要がある。
        include:
          - os: ubuntu-latest
            asset: bake-linux-x64
            binary: dist/bake
            checks: true
          - os: macos-latest
            asset: bake-darwin-arm64
            binary: dist/bake
            checks: true
          # テストは Unix 前提（chmod 0o755 や /tmp 直下の一時ディレクトリなど）のため、
          # Windows ではビルドとアーティファクト生成のみ実行する。
          # 更新機構の Windows 分岐は platform を注入して Unix 上で検証済み
          # （test/update/installer.test.ts の describe("win32")）。
          # Windows でのテスト実行対応は follow-up。
          - os: windows-latest
            asset: bake-windows-x64.exe
            binary: dist/bake.exe
            checks: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (bake typecheck)
        if: matrix.checks
        run: bun src/cli/main.ts typecheck

      - name: Format check (bake fmt)
        if: matrix.checks
        run: bun src/cli/main.ts fmt

      - name: Test (bake test)
        if: matrix.checks
        run: bun src/cli/main.ts test

      - name: Build (bake build) — branch push
        if: github.ref_type == 'branch'
        run: bun src/cli/main.ts build

      - name: Build (bake build:prod) — tag push
        if: github.ref_type == 'tag'
        run: bun src/cli/main.ts build:prod

      - name: Upload bake binary (CI artifact) — branch push
        if: github.ref_type == 'branch'
        uses: actions/upload-artifact@v4
        with:
          name: bake-${{ matrix.os }}-${{ github.ref_name }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 14

      - name: Stage release binary — tag push
        if: github.ref_type == 'tag'
        shell: bash
        run: cp "${{ matrix.binary }}" "${{ matrix.asset }}"

      # release job へ受け渡すための workflow アーティファクト。
      # ここでは write 権限は不要。
      - name: Upload release binary artifact — tag push
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 1

  # tag push 専用。GitHub Release への書き込み権限はこの job だけが持つ。
  release:
    name: Attach binaries to GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          fail_on_unmatched_files: true
          generate_release_notes: true
